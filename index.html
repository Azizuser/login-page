<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi Wi-Fi & Pendaftaran</title>
    
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --danger-color: #ef4444;
            --success-color: #22c55e;
            --warning-color: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
        }

        /* TOMBOL ADMIN GLOWING */
        .admin-glow-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: #00f0ff;
            border: 2px solid #38bdf8;
            cursor: pointer;
            box-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff;
            animation: glowing-pulse 1.8s infinite ease-in-out;
            transition: transform 0.2s ease;
        }

        .admin-glow-btn:hover {
            transform: scale(1.3);
        }

        @keyframes glowing-pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        .wifi-icon-animated {
            width: 32px;
            height: 32px;
            fill: none;
            stroke: var(--accent-color);
            stroke-width: 2.2;
            stroke-linecap: round;
        }

        .title-with-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            color: var(--accent-color);
        }

        h2 { color: var(--accent-color); margin-bottom: 20px; }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #94a3b8;
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input { padding-right: 42px; }

        .toggle-password {
            position: absolute;
            right: 8px;
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
        }

        .toggle-password svg {
            width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2;
        }

        .toggle-password:hover { color: var(--accent-color); }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 14px;
        }

        button.btn-primary {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button.btn-secondary { background-color: #334155; color: #fff; }
        button.btn-success { background-color: var(--success-color); color: #fff; }
        button.btn-danger { background-color: transparent; color: var(--danger-color); border: 1px solid var(--danger-color); }
        
        button:hover { opacity: 0.85; }

        #qrcode {
            margin: 15px auto;
            padding: 15px;
            background: #fff;
            border-radius: 12px;
            display: inline-block;
        }

        .info-box {
            background-color: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            text-align: left;
        }

        .info-item {
            margin-bottom: 8px;
            word-break: break-all;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-item span { color: var(--accent-color); font-weight: bold; }

        .copy-btn, .action-table-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .copy-btn:hover { color: var(--accent-color); }
        .action-table-btn { margin: 2px; }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .table-container {
            max-height: 180px;
            overflow-y: auto;
            margin-top: 8px;
            border: 1px solid #334155;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }

        th, td {
            padding: 8px 10px;
            border-bottom: 1px solid #334155;
        }

        th { background-color: #0f172a; color: var(--accent-color); position: sticky; top: 0; z-index: 1; }

        .badge-pending { color: var(--warning-color); font-weight: bold; font-size: 11px; }
        .badge-approved { color: var(--success-color); font-weight: bold; font-size: 11px; }

        .link-text {
            margin-top: 15px;
            font-size: 13px;
            color: #94a3b8;
        }
        .link-text span {
            color: var(--accent-color);
            cursor: pointer;
            text-decoration: underline;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 1. HALAMAN LOGIN USER -->
    <div id="userLoginCard" class="container">
        <div class="admin-glow-btn" title="Login Admin" onclick="openAdminModalFromStart()"></div>
        <h2>Login User Wi-Fi</h2>
        <form onsubmit="loginUser(event)">
            <div class="input-group">
                <label>Username:</label>
                <input type="text" id="loginUsername" placeholder="Username terdaftar..." required>
            </div>
            <div class="input-group">
                <label>Password:</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" placeholder="Password..." required>
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('loginPassword', this)">
                        <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-primary">Masuk</button>
        </form>
        <div class="link-text">
            Belum punya akun? <span onclick="showRegisterPage()">Daftar di sini</span>
        </div>
    </div>

    <!-- 1.1 HALAMAN PENDAFTARAN (REGISTER) -->
    <div id="userRegisterCard" class="container hidden">
        <h2>Daftar Akun Baru</h2>
        <form onsubmit="registerUser(event)">
            <div class="input-group">
                <label>Buat Username:</label>
                <input type="text" id="regUsername" placeholder="Username..." required>
            </div>
            <div class="input-group">
                <label>Buat Password:</label>
                <div class="password-wrapper">
                    <input type="password" id="regPassword" placeholder="Password..." required>
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('regPassword', this)">
                        <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-primary btn-success">Kirim Permintaan Daftar</button>
            <button type="button" class="btn-primary btn-secondary" onclick="showLoginPage()">Kembali ke Login</button>
        </form>
    </div>

    <!-- 2. HALAMAN UTAMA (QR CODE & DETAIL WI-FI) -->
    <div id="wifiCard" class="container hidden">
        <div class="admin-glow-btn" title="Panel Admin" onclick="openAdminModal()"></div>
        <div class="title-with-icon">
            <svg class="wifi-icon-animated" viewBox="0 0 24 24"><path d="M2 8.82a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16.5a5 5 0 0 1 7 0M12 20h.01"/></svg>
            <h2>Scan Wi-Fi</h2>
        </div>
        
        <div id="qrcode"></div>

        <div class="info-box">
            <div class="info-item">
                <div>SSID: <span id="displaySSID">Loading...</span></div>
                <button class="copy-btn" onclick="copyToClipboard('displaySSID', 'SSID')">📋 Salin</button>
            </div>
            <div class="info-item">
                <div>Password: <span id="displayPass">Loading...</span></div>
                <button class="copy-btn" onclick="copyToClipboard('displayPass', 'Password')">📋 Salin</button>
            </div>
        </div>

        <div class="action-grid">
            <button class="btn-primary btn-success" style="margin-top:0;" onclick="downloadQRCode()">📥 Unduh QR</button>
            <button class="btn-primary btn-secondary" style="margin-top:0;" onclick="copyAllConfig()">📋 Salin Semua</button>
        </div>

        <button class="btn-primary btn-danger" onclick="logout()">Logout</button>
    </div>

    <!-- 3. MODAL LOGIN ADMIN -->
    <div id="adminLoginCard" class="container hidden">
        <h2>Login Admin</h2>
        <form onsubmit="loginAdmin(event)">
            <div class="input-group">
                <label>Password Admin:</label>
                <div class="password-wrapper">
                    <input type="password" id="adminPassInput" placeholder="Password Admin..." required>
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('adminPassInput', this)">
                        <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-primary">Masuk Admin</button>
            <button type="button" class="btn-primary btn-secondary" onclick="closeAdminModal()">Batal</button>
        </form>
    </div>

    <!-- 4. MODAL PANEL ADMIN -->
    <div id="adminPanelCard" class="container hidden" style="max-width: 500px;">
        <h2>Panel Admin</h2>
        
        <!-- Pengaturan Wi-Fi -->
        <div style="text-align: left; margin-bottom: 15px;">
            <h3 style="font-size: 15px; color: var(--accent-color); margin-bottom: 8px;">Pengaturan Wi-Fi</h3>
            <div class="input-group" style="margin-bottom: 10px;">
                <label>SSID Baru:</label>
                <input type="text" id="editSSID">
            </div>
            <div class="input-group" style="margin-bottom: 10px;">
                <label>Password Wi-Fi Baru:</label>
                <input type="text" id="editPass">
            </div>
            <button class="btn-primary" style="margin-top:0;" onclick="saveWifiConfig()">Simpan Perubahan Wi-Fi</button>
        </div>

        <!-- Tabel Permintaan Pending -->
        <div style="text-align: left;">
            <h3 style="font-size: 15px; color: var(--accent-color); margin-bottom: 5px;">Permintaan Akun Pending</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="pendingUsersTable">
                        <tr><td colspan="2" style="text-align: center;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Tabel Seluruh Akun Terdaftar -->
        <div style="text-align: left;">
            <h3 style="font-size: 15px; color: var(--accent-color); margin-bottom: 5px;">Daftar Seluruh Pengguna</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="allUsersTable">
                        <tr><td colspan="3" style="text-align: center;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <button class="btn-primary btn-secondary" style="margin-top: 10px;" onclick="closeAdminPanel()">Tutup Panel</button>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://my-page-489f5-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let qrcode = new QRCode(document.getElementById("qrcode"), { width: 180, height: 180 });
        
        const ADMIN_HASH = "2d7532e279254ca6bf0cd7954e1baf659975803338dfbc9d31058d5e8009f7ea";
        let cameFromStart = false;

        async function getHash(text) {
            const msgBuffer = new TextEncoder().encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Sinkronisasi Data Wi-Fi dari Firebase
        database.ref('wifiConfig').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const ssid = data.ssid || "-";
                const pass = data.pass || "-";
                document.getElementById('displaySSID').innerText = ssid;
                document.getElementById('displayPass').innerText = pass;
                document.getElementById('editSSID').value = ssid;
                document.getElementById('editPass').value = pass;

                const qrText = `WIFI:S:${ssid};T:WPA;P:${pass};;`;
                qrcode.clear();
                qrcode.makeCode(qrText);
            }
        });

        // Sinkronisasi & Render Data User di Panel Admin
        database.ref('users').on('value', (snapshot) => {
            const users = snapshot.val();
            const pendingTbody = document.getElementById('pendingUsersTable');
            const allTbody = document.getElementById('allUsersTable');
            
            pendingTbody.innerHTML = "";
            allTbody.innerHTML = "";

            let hasPending = false;
            let hasUsers = false;

            if (users) {
                for (let key in users) {
                    let user = users[key];
                    hasUsers = true;

                    // Baris untuk Tabel Semua User
                    let statusBadge = user.status === "approved" 
                        ? `<span class="badge-approved">Approved</span>` 
                        : `<span class="badge-pending">Pending</span>`;

                    allTbody.innerHTML += `
                        <tr>
                            <td>${user.username}</td>
                            <td>${statusBadge}</td>
                            <td>
                                <button class="btn-danger action-table-btn" onclick="deleteUser('${key}')">Hapus</button>
                            </td>
                        </tr>
                    `;

                    // Baris khusus untuk Tabel Pending
                    if (user.status === "pending") {
                        hasPending = true;
                        pendingTbody.innerHTML += `
                            <tr>
                                <td>${user.username}</td>
                                <td>
                                    <button class="btn-success action-table-btn" onclick="approveUser('${key}')">Setujui</button>
                                    <button class="btn-danger action-table-btn" onclick="deleteUser('${key}')">Tolak</button>
                                </td>
                            </tr>
                        `;
                    }
                }
            }

            if (!hasPending) {
                pendingTbody.innerHTML = `<tr><td colspan="2" style="text-align: center; color: #64748b;">Tidak ada permintaan baru</td></tr>`;
            }

            if (!hasUsers) {
                allTbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #64748b;">Belum ada akun terdaftar</td></tr>`;
            }
        });

        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            input.type = input.type === "password" ? "text" : "password";
        }

        function showRegisterPage() {
            document.getElementById('userLoginCard').classList.add('hidden');
            document.getElementById('userRegisterCard').classList.remove('hidden');
        }

        function showLoginPage() {
            document.getElementById('userRegisterCard').classList.add('hidden');
            document.getElementById('userLoginCard').classList.remove('hidden');
        }

        // Proses Pendaftaran User Baru
        async function registerUser(event) {
            event.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const hashedPassword = await getHash(password);

            database.ref('users').orderByChild('username').equalTo(username).once('value', async (snapshot) => {
                if (snapshot.exists()) {
                    alert("Username sudah digunakan, silakan gunakan username lain!");
                } else {
                    await database.ref('users').push({
                        username: username,
                        password: hashedPassword,
                        status: "pending"
                    });
                    alert("Pendaftaran berhasil! Silakan tunggu persetujuan dari admin.");
                    document.getElementById('regUsername').value = "";
                    document.getElementById('regPassword').value = "";
                    showLoginPage();
                }
            });
        }

        // Proses Login User
        async function loginUser(event) {
            event.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const hashedPassword = await getHash(password);

            database.ref('users').orderByChild('username').equalTo(username).once('value', (snapshot) => {
                if (snapshot.exists()) {
                    let userData = null;
                    snapshot.forEach((childSnapshot) => {
                        userData = childSnapshot.val();
                    });

                    if (userData.password === hashedPassword) {
                        if (userData.status === "approved") {
                            document.getElementById('userLoginCard').classList.add('hidden');
                            document.getElementById('wifiCard').classList.remove('hidden');
                            document.getElementById('loginUsername').value = "";
                            document.getElementById('loginPassword').value = "";
                        } else {
                            alert("Akun Anda belum disetujui oleh Admin!");
                        }
                    } else {
                        alert("Password salah!");
                    }
                } else {
                    alert("Username tidak ditemukan!");
                }
            });
        }

        // Setujui User (Admin)
        function approveUser(userId) {
            database.ref('users/' + userId).update({ status: "approved" }, () => {
                alert("Akun berhasil disetujui!");
            });
        }

        // Hapus User Kapan Saja (Admin)
        function deleteUser(userId) {
            if (confirm("Apakah Anda yakin ingin menghapus akun ini?")) {
                database.ref('users/' + userId).remove(() => {
                    alert("Akun berhasil dihapus.");
                });
            }
        }

        async function loginAdmin(event) {
            event.preventDefault();
            const input = document.getElementById('adminPassInput').value.trim();
            const hashedInput = await getHash(input);

            if (hashedInput === ADMIN_HASH) {
                document.getElementById('adminLoginCard').classList.add('hidden');
                document.getElementById('adminPanelCard').classList.remove('hidden');
                document.getElementById('adminPassInput').value = '';
            } else {
                alert("Password Admin Salah!");
            }
        }

        function logout() {
            document.getElementById('wifiCard').classList.add('hidden');
            document.getElementById('userLoginCard').classList.remove('hidden');
        }

        function openAdminModalFromStart() {
            cameFromStart = true;
            document.getElementById('userLoginCard').classList.add('hidden');
            document.getElementById('adminLoginCard').classList.remove('hidden');
        }

        function openAdminModal() {
            cameFromStart = false;
            document.getElementById('wifiCard').classList.add('hidden');
            document.getElementById('adminLoginCard').classList.remove('hidden');
        }

        function closeAdminModal() {
            document.getElementById('adminLoginCard').classList.add('hidden');
            if (cameFromStart) {
                document.getElementById('userLoginCard').classList.remove('hidden');
            } else {
                document.getElementById('wifiCard').classList.remove('hidden');
            }
        }

        function closeAdminPanel() {
            document.getElementById('adminPanelCard').classList.add('hidden');
            document.getElementById('wifiCard').classList.remove('hidden');
        }

        function saveWifiConfig() {
            const newSSID = document.getElementById('editSSID').value;
            const newPass = document.getElementById('editPass').value;

            if (!newSSID || !newPass) {
                alert("SSID dan Password tidak boleh kosong!");
                return;
            }

            database.ref('wifiConfig').set({
                ssid: newSSID,
                pass: newPass
            }).then(() => {
                alert("Konfigurasi Wi-Fi berhasil diperbarui!");
            });
        }

        function copyToClipboard(elementId, label) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text).then(() => { alert(`${label} berhasil disalin!`); });
        }

        function copyAllConfig() {
            const ssid = document.getElementById('displaySSID').innerText;
            const pass = document.getElementById('displayPass').innerText;
            navigator.clipboard.writeText(`SSID: ${ssid}\nPassword: ${pass}`).then(() => { alert("Berhasil disalin!"); });
        }

        function downloadQRCode() {
            const qrImg = document.querySelector("#qrcode img");
            if (qrImg && qrImg.src) {
                const link = document.createElement("a");
                link.href = qrImg.src;
                link.download = "wifi-qrcode.png";
                link.click();
            } else {
                alert("QR Code belum siap.");
            }
        }
    </script>
</body>
</html>
