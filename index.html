
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Login</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.box{
    background:#fff;
    padding:30px;
    border-radius:12px;
    width:320px;
    text-align:center;
    box-shadow:0 0 15px rgba(0,0,0,.2);
}
input{
    width:100%;
    padding:12px;
    margin:15px 0;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}
button{
    width:100%;
    padding:12px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
button:hover{
    background:#1d4ed8;
}
#error{
    color:red;
    margin-top:10px;
}
</style>
</head>
<body>

<div class="box">
    <h2>Portal Login</h2>

    <input type="password" id="password" placeholder="Masukkan Password">

    <button onclick="login()">Masuk</button>

    <p id="error"></p>
</div>

<script>
const PASSWORD = "USERROOM123"; // Ganti password di sini

function login(){
    const pass = document.getElementById("password").value;

    if(pass === PASSWORD){
        window.location.href = "https://azizuser.github.io/WIFI-PAGE/";
    }else{
        document.getElementById("error").innerText = "Password salah!";
    }
}
</script>

</body>
</html>
