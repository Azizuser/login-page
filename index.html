<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi Wi-Fi</title>
    
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --danger-color: #ef4444;
            --success-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
        }

        /* --- TOMBOL ADMIN: LINGKARAN BIRU TERANG BERPENDAR --- */
        .admin-glow-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: #00f0ff;
            border: 2px solid #38bdf8;
            cursor: pointer;
            box-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff;
            animation: glowing-pulse 1.8s infinite ease-in-out;
            transition: transform 0.2s ease;
        }

        .admin-glow-btn:hover {
            transform: scale(1.3);
            box-shadow: 0 0 15px #00f0ff, 0 0 30px #00f0ff;
        }

        @keyframes glowing-pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 8px #00f0ff, 0 0 16px #00f0ff;
                opacity: 0.8;
            }
            50% {
                transform: scale(1.15);
                box-shadow: 0 0 16px #00f0ff, 0 0 32px #00f0ff, 0 0 45px #38bdf8;
                opacity: 1;
            }
        }

        /* --- ANIMASI IKON WI-FI KEREN --- */
        .wifi-icon-animated {
            width: 32px;
            height: 32px;
            fill: none;
            stroke: var(--accent-color);
            stroke-width: 2.2;
            stroke-linecap: round;
            filter: drop-shadow(0 0 6px var(--accent-color));
        }

        .wifi-dot {
            animation: wifi-pulse 1.8s infinite ease-in-out;
        }

        .wifi-wave-1 {
            animation: wifi-pulse 1.8s infinite ease-in-out;
            animation-delay: 0.3s;
        }

        .wifi-wave-2 {
            animation: wifi-pulse 1.8s infinite ease-in-out;
            animation-delay: 0.6s;
        }

        @keyframes wifi-pulse {
            0%, 100% {
                opacity: 0.3;
                stroke: #475569;
            }
            50% {
                opacity: 1;
                stroke: var(--accent-color);
            }
        }

        /* Judul dengan Ikon Samping */
        .title-with-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            color: var(--accent-color);
        }

        h2 {
            color: var(--accent-color);
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #94a3b8;
        }

        /* Input Password dengan Ikon Mata Line Modern & Glowing */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input {
            padding-right: 42px;
        }

        .toggle-password {
            position: absolute;
            right: 8px;
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .toggle-password:hover {
            color: var(--accent-color);
        }

        .toggle-password.active {
            color: var(--accent-color);
            filter: drop-shadow(0 0 6px var(--accent-color));
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 14px;
        }

        button.btn-primary {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button.btn-secondary {
            background-color: #334155;
            color: #fff;
        }

        button.btn-success {
            background-color: var(--success-color);
            color: #fff;
        }

        button.btn-danger {
            background-color: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            margin-top: 15px;
        }

        button.btn-primary:hover, button.btn-danger:hover, button.btn-secondary:hover, button.btn-success:hover {
            opacity: 0.85;
        }

        #qrcode {
            margin: 15px auto;
            padding: 15px;
            background: #fff;
            border-radius: 12px;
            display: inline-block;
        }

        #qrcode img {
            margin: 0 auto;
        }

        .info-box {
            background-color: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            text-align: left;
        }

        .info-item {
            margin-bottom: 8px;
            word-break: break-all;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-item span {
            color: var(--accent-color);
            font-weight: bold;
        }

        .copy-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 14px;
            margin-left: 8px;
        }

        .copy-btn:hover {
            color: var(--accent-color);
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- 1. HALAMAN LOGIN USER -->
    <div id="userLoginCard" class="container">
        <!-- Tombol Admin Lingkaran Glowing -->
        <div class="admin-glow-btn" title="Login Admin" onclick="openAdminModalFromStart()"></div>
        
        <h2 style="margin-bottom: 20px;">Akses Wi-Fi</h2>
        <form onsubmit="loginUser(event)">
            <div class="input-group">
                <label>Masukkan Passcode Kunjungan:</label>
                <div class="password-wrapper">
                    <input type="password" id="userPassInput" placeholder="Password User..." required>
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('userPassInput', this)">
                        <svg viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                            <line class="eye-off-line" x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-primary">Masuk User</button>
        </form>
    </div>

    <!-- 2. HALAMAN UTAMA (QR CODE & DETAIL) -->
    <div id="wifiCard" class="container hidden">
        <!-- Tombol Admin Lingkaran Glowing -->
        <div class="admin-glow-btn" title="Panel Admin" onclick="openAdminModal()"></div>
        
        <!-- Judul Disertai Ikon Sinyal Wi-Fi Beranimasi -->
        <div class="title-with-icon">
            <svg class="wifi-icon-animated" viewBox="0 0 24 24" style="width:36px; height:36px;">
                <path class="wifi-wave-2" d="M2 8.82a15 15 0 0 1 20 0"/>
                <path class="wifi-wave-1" d="M5 12.5a10 10 0 0 1 14 0"/>
                <path class="wifi-dot" d="M8.5 16.5a5 5 0 0 1 7 0M12 20h.01"/>
            </svg>
            <h2>Scan Wi-Fi</h2>
        </div>
        
        <div id="qrcode"></div>

        <div class="info-box">
            <div class="info-item">
                <div>SSID: <span id="displaySSID">Loading...</span></div>
                <button class="copy-btn" title="Salin SSID" onclick="copyToClipboard('displaySSID', 'SSID')">📋 Salin</button>
            </div>
            <div class="info-item">
                <div>Password: <span id="displayPass">Loading...</span></div>
                <button class="copy-btn" title="Salin Password" onclick="copyToClipboard('displayPass', 'Password')">📋 Salin</button>
            </div>
        </div>

        <div class="action-grid">
            <button class="btn-primary btn-success" style="margin-top:0;" onclick="downloadQRCode()">📥 Unduh QR</button>
            <button class="btn-primary btn-secondary" style="margin-top:0;" onclick="copyAllConfig()">📋 Salin Semua</button>
        </div>

        <button class="btn-primary btn-danger" onclick="logout()">Logout / Keluar</button>
    </div>

    <!-- 3. MODAL LOGIN ADMIN -->
    <div id="adminLoginCard" class="container hidden">
        <h2 style="margin-bottom: 20px;">Login Admin</h2>
        <form onsubmit="loginAdmin(event)">
            <div class="input-group">
                <label>Password Admin:</label>
                <div class="password-wrapper">
                    <input type="password" id="adminPassInput" placeholder="Password Admin..." required>
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('adminPassInput', this)">
                        <svg viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                            <line class="eye-off-line" x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-primary">Masuk Admin</button>
            <button type="button" class="btn-primary btn-secondary" style="margin-top: 5px;" onclick="closeAdminModal()">Batal</button>
        </form>
    </div>

    <!-- 4. MODAL PANEL ADMIN -->
    <div id="adminPanelCard" class="container hidden">
        <h2 style="margin-bottom: 20px;">Pengaturan Wi-Fi</h2>
        <div class="input-group">
            <label>SSID Baru:</label>
            <input type="text" id="editSSID">
        </div>
        <div class="input-group">
            <label>Password Wi-Fi Baru:</label>
            <div class="password-wrapper">
                <input type="password" id="editPass">
                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('editPass', this)">
                    <svg viewBox="0 0 24 24">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                        <line class="eye-off-line" x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
            </div>
        </div>
        <button class="btn-primary" onclick="saveWifiConfig()">Simpan Perubahan</button>
        <button class="btn-primary btn-secondary" style="margin-top: 5px;" onclick="closeAdminPanel()">Tutup</button>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://my-page-489f5-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let qrcode = new QRCode(document.getElementById("qrcode"), { width: 180, height: 180 });
        
        // HASH TARGET
        const USER_HASH = "1667a88832e79fe57d342ac316f4b662c88d23dc549a78caa4fc54604471007c";
        const ADMIN_HASH = "2d7532e279254ca6bf0cd7954e1baf659975803338dfbc9d31058d5e8009f7ea";

        let cameFromStart = false;

        async function getHash(text) {
            const msgBuffer = new TextEncoder().encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        database.ref('wifiConfig').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const ssid = data.ssid || "-";
                const pass = data.pass || "-";

                document.getElementById('displaySSID').innerText = ssid;
                document.getElementById('displayPass').innerText = pass;

                document.getElementById('editSSID').value = ssid;
                document.getElementById('editPass').value = pass;

                const qrText = `WIFI:S:${ssid};T:WPA;P:${pass};;`;
                qrcode.clear();
                qrcode.makeCode(qrText);
            }
        });

        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const eyeLine = btn.querySelector('.eye-off-line');

            if (input.type === "password") {
                input.type = "text";
                btn.classList.add('active');
                if (eyeLine) eyeLine.style.display = 'none';
            } else {
                input.type = "password";
                btn.classList.remove('active');
                if (eyeLine) eyeLine.style.display = 'block';
            }
        }

        function copyToClipboard(elementId, label) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert(`${label} berhasil disalin!`);
            });
        }

        function copyAllConfig() {
            const ssid = document.getElementById('displaySSID').innerText;
            const pass = document.getElementById('displayPass').innerText;
            const textToCopy = `SSID: ${ssid}\nPassword: ${pass}`;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert("SSID dan Password berhasil disalin!");
            });
        }

        function downloadQRCode() {
            const qrImg = document.querySelector("#qrcode img");
            if (qrImg && qrImg.src) {
                const link = document.createElement("a");
                link.href = qrImg.src;
                link.download = "wifi-qrcode.png";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } else {
                alert("QR Code belum siap untuk diunduh.");
            }
        }

        async function loginUser(event) {
            if (event) event.preventDefault();
            const input = document.getElementById('userPassInput').value.trim();
            const hashedInput = await getHash(input);
            
            if (hashedInput === USER_HASH) {
                document.getElementById('userLoginCard').classList.add('hidden');
                document.getElementById('wifiCard').classList.remove('hidden');
                document.getElementById('userPassInput').value = '';
            } else {
                alert("Password Salah!");
            }
        }

        async function loginAdmin(event) {
            if (event) event.preventDefault();
            const input = document.getElementById('adminPassInput').value.trim();
            const hashedInput = await getHash(input);

            if (hashedInput === ADMIN_HASH) {
                document.getElementById('adminLoginCard').classList.add('hidden');
                document.getElementById('adminPanelCard').classList.remove('hidden');
                document.getElementById('adminPassInput').value = '';
            } else {
                alert("Password Admin Salah!");
            }
        }

        function logout() {
            document.getElementById('wifiCard').classList.add('hidden');
            document.getElementById('userLoginCard').classList.remove('hidden');
        }

        function openAdminModalFromStart() {
            cameFromStart = true;
            document.getElementById('userLoginCard').classList.add('hidden');
            document.getElementById('adminLoginCard').classList.remove('hidden');
        }

        function openAdminModal() {
            cameFromStart = false;
            document.getElementById('wifiCard').classList.add('hidden');
            document.getElementById('adminLoginCard').classList.remove('hidden');
        }

        function closeAdminModal() {
            document.getElementById('adminLoginCard').classList.add('hidden');
            if (cameFromStart) {
                document.getElementById('userLoginCard').classList.remove('hidden');
            } else {
                document.getElementById('wifiCard').classList.remove('hidden');
            }
        }

        function closeAdminPanel() {
            document.getElementById('adminPanelCard').classList.add('hidden');
            document.getElementById('wifiCard').classList.remove('hidden');
        }

        function saveWifiConfig() {
            const newSSID = document.getElementById('editSSID').value;
            const newPass = document.getElementById('editPass').value;

            if (!newSSID || !newPass) {
                alert("SSID dan Password tidak boleh kosong!");
                return;
            }

            database.ref('wifiConfig').set({
                ssid: newSSID,
                pass: newPass
            }).then(() => {
                alert("Data berhasil tersimpan ke Firebase!");
                closeAdminPanel();
            }).catch((err) => {
                alert("Gagal menyimpan data: " + err.message);
            });
        }
    </script>
</body>
</html>
