<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi Wi-Fi</title>
    
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- CryptoJS (Verifikasi Hash SHA-256) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
        }

        /* Ikon SVG Wi-Fi Berpendar */
        .admin-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            color: var(--accent-color);
            cursor: pointer;
            transition: transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }

        .admin-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
            filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.6));
            animation: pulse-glow 2s infinite alternate;
        }

        .admin-btn:hover {
            transform: scale(1.15);
        }

        @keyframes pulse-glow {
            0% {
                filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.4));
                opacity: 0.7;
            }
            100% {
                filter: drop-shadow(0 0 8px rgba(56, 189, 248, 1));
                opacity: 1;
            }
        }

        h2 {
            margin-bottom: 20px;
            color: var(--accent-color);
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #94a3b8;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 14px;
        }

        button.btn-primary {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button.btn-danger {
            background-color: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            margin-top: 15px;
        }

        button.btn-primary:hover, button.btn-danger:hover {
            opacity: 0.85;
        }

        #qrcode {
            margin: 20px auto;
            padding: 15px;
            background: #fff;
            border-radius: 12px;
            display: inline-block;
        }

        .info-box {
            background-color: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: left;
        }

        .info-item {
            margin-bottom: 8px;
            word-break: break-all;
        }

        .info-item span {
            color: var(--accent-color);
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- 1. HALAMAN LOGIN USER -->
    <div id="userLoginCard" class="container">
        <!-- Ikon Sinyal Wi-Fi Berpendar -->
        <button class="admin-btn" title="Login Admin" onclick="openAdminModalFromStart()">
            <svg viewBox="0 0 24 24">
                <path d="M12 18c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm6.36-4.95a8.98 8.98 0 0 0-12.72 0l1.41 1.41a6.98 6.98 0 0 1 9.9 0l1.41-1.41zm3.54-3.54a13.96 13.96 0 0 0-19.8 0l1.41 1.41a11.97 11.97 0 0 1 16.97 0l1.42-1.41z"/>
            </svg>
        </button>
        
        <h2>Akses Wi-Fi</h2>
        <div class="input-group">
            <label>Masukkan Passcode Kunjungan:</label>
            <input type="password" id="userPassInput" placeholder="Password User...">
        </div>
        <button class="btn-primary" onclick="loginUser()">Masuk User</button>
    </div>

    <!-- 2. HALAMAN UTAMA (QR CODE & DETAIL) -->
    <div id="wifiCard" class="container hidden">
        <!-- Ikon Sinyal Wi-Fi Berpendar -->
        <button class="admin-btn" title="Panel Admin" onclick="openAdminModal()">
            <svg viewBox="0 0 24 24">
                <path d="M12 18c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm6.36-4.95a8.98 8.98 0 0 0-12.72 0l1.41 1.41a6.98 6.98 0 0 1 9.9 0l1.41-1.41zm3.54-3.54a13.96 13.96 0 0 0-19.8 0l1.41 1.41a11.97 11.97 0 0 1 16.97 0l1.42-1.41z"/>
            </svg>
        </button>
        <h2>Scan Wi-Fi</h2>
        
        <div id="qrcode"></div>

        <div class="info-box">
            <div class="info-item">SSID: <span id="displaySSID">Loading...</span></div>
            <div class="info-item">Password: <span id="displayPass">Loading...</span></div>
        </div>

        <!-- Tombol Logout -->
        <button class="btn-primary btn-danger" onclick="logout()">Logout / Keluar</button>
    </div>

    <!-- 3. MODAL LOGIN ADMIN -->
    <div id="adminLoginCard" class="container hidden">
        <h2>Login Admin</h2>
        <div class="input-group">
            <label>Password Admin:</label>
            <input type="password" id="adminPassInput" placeholder="Password Admin...">
        </div>
        <button class="btn-primary" onclick="loginAdmin()">Masuk Admin</button>
        <button class="btn-primary" style="background: #334155; color: #fff; margin-top: 5px;" onclick="closeAdminModal()">Batal</button>
    </div>

    <!-- 4. MODAL PANEL ADMIN (EDIT SSID & PASS) -->
    <div id="adminPanelCard" class="container hidden">
        <h2>Pengaturan Wi-Fi</h2>
        <div class="input-group">
            <label>SSID Baru:</label>
            <input type="text" id="editSSID">
        </div>
        <div class="input-group">
            <label>Password Wi-Fi Baru:</label>
            <input type="text" id="editPass">
        </div>
        <button class="btn-primary" onclick="saveWifiConfig()">Simpan Perubahan</button>
        <button class="btn-primary" style="background: #334155; color: #fff; margin-top: 5px;" onclick="closeAdminPanel()">Tutup</button>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://my-page-489f5-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let qrcode = new QRCode(document.getElementById("qrcode"), { width: 180, height: 180 });
        
        // HASH SHA-256 (USER_HASH TELAH DI-UPDATE)
        const USER_HASH = "9b18e501812483c63d7f078b8b1a23178baca4fd23b08fe5e7ff43b334c8c82d";
        const ADMIN_HASH = "2d7532e279254ca6bf0cd7954e1baf659975803338dfbc9d31058d5e8009f7ea";

        let cameFromStart = false;

        function getHash(text) {
            return CryptoJS.SHA256(text).toString();
        }

        database.ref('wifiConfig').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const ssid = data.ssid || "-";
                const pass = data.pass || "-";

                document.getElementById('displaySSID').innerText = ssid;
                document.getElementById('displayPass').innerText = pass;

                document.getElementById('editSSID').value = ssid;
                document.getElementById('editPass').value = pass;

                const qrText = `WIFI:S:${ssid};T:WPA;P:${pass};;`;
                qrcode.clear();
                qrcode.makeCode(qrText);
            }
        });

        function loginUser() {
            const input = document.getElementById('userPassInput').value;
            if (getHash(input) === USER_HASH) {
                document.getElementById('userLoginCard').classList.add('hidden');
                document.getElementById('wifiCard').classList.remove('hidden');
                document.getElementById('userPassInput').value = '';
            } else {
                alert("Password Salah!");
            }
        }

        function logout() {
            document.getElementById('wifiCard').classList.add('hidden');
            document.getElementById('userLoginCard').classList.remove('hidden');
        }

        function openAdminModalFromStart() {
            cameFromStart = true;
            document.getElementById('userLoginCard').classList.add('hidden');
            document.getElementById('adminLoginCard').classList.remove('hidden');
        }

        function openAdminModal() {
            cameFromStart = false;
            document.getElementById('wifiCard').classList.add('hidden');
            document.getElementById('adminLoginCard').classList.remove('hidden');
        }

        function closeAdminModal() {
            document.getElementById('adminLoginCard').classList.add('hidden');
            if (cameFromStart) {
                document.getElementById('userLoginCard').classList.remove('hidden');
            } else {
                document.getElementById('wifiCard').classList.remove('hidden');
            }
        }

        function loginAdmin() {
            const input = document.getElementById('adminPassInput').value;
            if (getHash(input) === ADMIN_HASH) {
                document.getElementById('adminLoginCard').classList.add('hidden');
                document.getElementById('adminPanelCard').classList.remove('hidden');
                document.getElementById('adminPassInput').value = '';
            } else {
                alert("Password Admin Salah!");
            }
        }

        function closeAdminPanel() {
            document.getElementById('adminPanelCard').classList.add('hidden');
            document.getElementById('wifiCard').classList.remove('hidden');
        }

        function saveWifiConfig() {
            const newSSID = document.getElementById('editSSID').value;
            const newPass = document.getElementById('editPass').value;

            if (!newSSID || !newPass) {
                alert("SSID dan Password tidak boleh kosong!");
                return;
            }

            database.ref('wifiConfig').set({
                ssid: newSSID,
                pass: newPass
            }).then(() => {
                alert("Data berhasil tersimpan ke Firebase!");
                closeAdminPanel();
            }).catch((err) => {
                alert("Gagal menyimpan data: " + err.message);
            });
        }
    </script>
</body>
</html>
