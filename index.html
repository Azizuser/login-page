<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Login Terenkripsi</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.box {
    background: #fff;
    padding: 30px;
    border-radius: 12px;
    width: 320px;
    text-align: center;
    box-shadow: 0 0 15px rgba(0,0,0,.2);
}

.input-container {
    position: relative;
    margin: 15px 0;
}

input {
    width: 100%;
    padding: 12px 40px 12px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 14px;
}

.toggle-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 16px;
    padding: 0;
    width: auto;
    color: #64748b;
}

button.primary-btn {
    width: 100%;
    padding: 12px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
}

button.primary-btn:hover {
    background: #1d4ed8;
}

button.logout-btn {
    width: 100%;
    padding: 12px;
    background: #ef4444;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 15px;
    transition: background 0.2s;
}

button.logout-btn:hover {
    background: #dc2626;
}

#error {
    color: #ef4444;
    margin-top: 10px;
    font-size: 14px;
}

.hidden {
    display: none;
}
</style>
</head>
<body>

<div class="box">
    <!-- TAMPILAN FORM LOGIN -->
    <div id="login-section">
        <h2>Portal Login</h2>
        
        <div class="input-container">
            <input type="password" id="password" placeholder="Masukkan Password" onkeyup="checkEnter(event)" oninput="clearError()">
            <button class="toggle-btn" onclick="togglePasswordVisibility()" type="button" id="eye-icon">👁</button>
        </div>

        <button class="primary-btn" onclick="login()">Masuk</button>
        <p id="error"></p>
    </div>

    <!-- TAMPILAN DASHBOARD SETELAH LOGIN / LOGOUT -->
    <div id="authenticated-section" class="hidden">
        <h2>Selamat Datang!</h2>
        <p style="margin: 15px 0; color: #475569;">Sesi Anda sedang aktif.</p>
        
        <button class="primary-btn" onclick="goToWifiPage()">Buka Halaman WiFi 📶</button>
        <button class="logout-btn" onclick="logout()">Keluar (Logout)</button>
    </div>
</div>

<script>
// Hash SHA-256 murni dari "penguna1122330" & "pengguna1122330"
const VALID_HASHES = [
    "37ed97d7e217a3a28768074895bbf6faec80ba560984cc17b996bd2dada42747", // penguna1122330
    "311545ee9bf5cdfd1cf0ccaa022ffaa1b2a94fb2a694bf6efc2f42a98f1f58b8"  // pengguna1122330
];

// Fungsi merubah teks ke SHA-256 via Web Crypto API
async function sha256(str) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
}

// Cek status sesi login ketika halaman dimuat
window.onload = function() {
    if (sessionStorage.getItem("isLoggedIn") === "true") {
        showAuthenticatedUI();
    }
};

async function login() {
    const rawInput = document.getElementById("password").value;
    const cleanInput = rawInput.trim();
    
    if(!cleanInput) {
        document.getElementById("error").innerText = "Password tidak boleh kosong!";
        return;
    }

    const inputHash = await sha256(cleanInput);

    if (VALID_HASHES.includes(inputHash)) {
        sessionStorage.setItem("isLoggedIn", "true");
        goToWifiPage();
    } else {
        document.getElementById("error").innerText = "Password salah!";
    }
}

function logout() {
    sessionStorage.removeItem("isLoggedIn");
    document.getElementById("login-section").classList.remove("hidden");
    document.getElementById("authenticated-section").classList.add("hidden");
    document.getElementById("password").value = "";
    document.getElementById("error").innerText = "";
}

function showAuthenticatedUI() {
    document.getElementById("login-section").classList.add("hidden");
    document.getElementById("authenticated-section").classList.remove("hidden");
}

function goToWifiPage() {
    window.location.href = "https://azizuser.github.io/WIFI-PAGE/";
}

function checkEnter(event) {
    if (event.key === "Enter") {
        login();
    }
}

function clearError() {
    document.getElementById("error").innerText = "";
}

function togglePasswordVisibility() {
    const passInput = document.getElementById("password");
    const eyeIcon = document.getElementById("eye-icon");
    
    if (passInput.type === "password") {
        passInput.type = "text";
        eyeIcon.innerText = "🙈";
    } else {
        passInput.type = "password";
        eyeIcon.innerText = "👁";
    }
}
</script>

</body>
</html>
